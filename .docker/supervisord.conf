[program:maintenance]
command=bash -c 'while true; do php /var/www/html/bin/console pimcore:maintenance --env=prod --no-debug; sleep 300; done'
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:data-import-cron]
command=bash -c 'while true; do php /var/www/html/bin/console datahub:data-importer:execute-cron --env=prod --no-debug; sleep 60; done'
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
