[unix_http_server]
file=/var/web/vd31987/var/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/web/vd31987/public_html/theo-pimcore/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/var/web/vd31987/var/supervisor/supervisord.pid
childlogdir=/var/web/vd31987/public_html/theo-pimcore/var/log
nodaemon=false
minfds=1024
environment=APP_ENV="prod",APP_DEBUG="0"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/web/vd31987/var/supervisor/supervisor.sock

[program:pimcore-core]
directory=/var/web/vd31987/public_html/theo-pimcore
command=/var/web/vd31987/.bin/php -d memory_limit=512M bin/console messenger:consume pimcore_core pimcore_maintenance pimcore_scheduled_tasks pimcore_asset_update --env=prod --no-debug --memory-limit=384M --time-limit=3600 --sleep=1
process_name=%(program_name)s
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/web/vd31987/public_html/theo-pimcore/var/log/worker-pimcore-core.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:pimcore-image-optimize]
directory=/var/web/vd31987/public_html/theo-pimcore
command=/var/web/vd31987/.bin/php -d memory_limit=512M bin/console messenger:consume pimcore_image_optimize --env=prod --no-debug --memory-limit=384M --time-limit=3600 --sleep=1
